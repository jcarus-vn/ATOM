name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - overrides/**
      - README.md
      - SKILL.md
      - BACKERS.md
      - mkdocs.yml
      - .github/workflows/deploy-docs.yml
      - .github/scripts/assemble-docs.sh
  pull_request:
    paths:
      - docs/**
      - overrides/**
      - README.md
      - SKILL.md
      - BACKERS.md
      - mkdocs.yml
      - .github/workflows/deploy-docs.yml
      - .github/scripts/assemble-docs.sh

# Read-only by default: a pull request (including one from a fork) builds the
# site with no write token. Only the deploy job, which runs on pushes to
# master, gets contents: write to push the gh-pages branch.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tags in comments) so a supply-chain
      # swap on a moving tag cannot alter the build. Zizmor-clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install mkdocs-material mkdocs-redirects
      - name: Assemble docs sources
        # Single-source: the Guide and Skill Reference pages are the repo-root
        # README.md / SKILL.md, copied in (never committed under docs/). The
        # landing page docs/index.md is committed and curated separately.
        #
        # README links are written repo-relative (`docs/faq.md`, `docs/assets/…`)
        # so they work on GitHub. Once the file lands *inside* docs/ they must
        # drop that prefix, otherwise every one of them 404s on the site.
        run: bash .github/scripts/assemble-docs.sh
      - name: Build
        run: mkdocs build

  deploy:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mkdocs gh-deploy pushes the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install mkdocs-material mkdocs-redirects
      - name: Assemble docs sources
        run: bash .github/scripts/assemble-docs.sh
      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force
